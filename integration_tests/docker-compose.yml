services:
  mailserver:
    image: mailserver/docker-mailserver:15.1.0
    hostname: mail.example.com
    ports:
      - "25:25"
      - "110:110"
      - "143:143"
      - "587:587"
    environment:
      - ENABLE_POP3=1
      - ENABLE_IMAP=1
      - ENABLE_SMTPS=1
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/tmp/ssl/tls.crt
      - SSL_KEY_PATH=/tmp/ssl/tls.key
      - OVERRIDE_HOSTNAME=mail.example.com
      - PERMIT_DOCKER=host
      - ENABLE_UPDATE_CHECK=0
    volumes:
      - ./mailserver/config:/tmp/docker-mailserver
      - ./mailserver/certs:/tmp/ssl:ro
    cap_add:
      - NET_ADMIN

  #  https://github.com/thkukuk/containers-mailserver/blob/master/openldap/README.md
  openldap:
    image: registry.opensuse.org/opensuse/openldap
    hostname: ldap.example.com
    ports:
      - "389:389" # LDAP w/ STARTTLS
      # - "636:636" # LDAPS
    environment:
      - LDAP_ORGANISATION="Example Inc."
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin123
      - LDAP_CONFIG_PASSWORD=config123
      - LDAP_TLS_CRT=/etc/openldap/certs/tls.crt
      - LDAP_TLS_KEY=/etc/openldap/certs/tls.key
      - LDAP_TLS_CA_CRT=/etc/openldap/certs/tls.crt
    volumes:
      - ./openldap/certs:/etc/openldap/certs

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=testdb
    command:
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server-cert.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
      - --tls-version=TLSv1.2
    volumes:
      - ./mysql/certs:/etc/mysql/certs:ro

  ftp:
    image: stilliard/pure-ftpd:bookworm-1.0.50
    ports:
      - "21:21"
    environment:
      - PUBLICHOST=localhost
      - FTP_USER_NAME=admin
      - FTP_USER_PASS=admin
      - FTP_USER_HOME=/home/admin
      - ADDED_FLAGS=--tls=2
    volumes:
      - ./ftp/certs:/etc/ssl/private:ro
